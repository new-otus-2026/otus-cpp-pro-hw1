name: 'C++ CI'

on:
  push:
    branches:
      - master
      - feature/github_actions

# Фикс ошибки "Resource not accessible": явно разрешить создавать релизы и теги
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Замена v2 на v4 (работает на современной Node.js)
      - uses: actions/checkout@v4
        with:
          submodules: true

      - run: sudo apt-get update && sudo apt-get install libboost-test-dev -y
      - run: cmake . -DPATCH_VERSION=${{ github.run_number }} -DWITH_BOOST_TEST=ON
      - run: cmake --build .
      - run: cmake --build . --target test
      - run: cmake --build . --target package

      # Создание релиза и загрузка .deb объединены в один современный шаг
      - name: Create Release and Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.0.${{ github.run_number }}
          name: Release 0.0.${{ github.run_number }}
          draft: false
          prerelease: false
          files: ./helloworld-0.0.${{ github.run_number }}-Linux.deb

